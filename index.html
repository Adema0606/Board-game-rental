<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокат настольных игр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
    <h1>Прокат настольных игр</h1>

    <div class="card">
      <h2>Добавить игру</h2>
      
      <div class="field">
        <label for="newGameTitle">Название игры</label>
        <input id="newGameTitle" type="text" placeholder="Например, Домино">
      </div>
      
      <div class="field">
        <label for="newGamePlayers">Число игроков</label>
        <input id="newGamePlayers" type="number" placeholder="4">
      </div>

      <div class="field">
        <label for="newGameCount">Количество экземпляров</label>
        <input id="newGameCount" type="number" placeholder="Сколько штук?">
      </div>
      
      <button id="addGameButton" type="button" class="btn-add">Добавить игру</button>
    </div>

    <div class="filter-group">
      <input type="checkbox" id="showOnlyFree">
      <label for="showOnlyFree">Показать только свободные</label>
    </div>

    <ul id="gameList" class="game-list"></ul>

    <div class="card">
      <h2>Выдача / Возврат</h2>
      
      <div class="field">
        <label for="gameSelect">Выберите игру</label>
        <select id="gameSelect"></select>
      </div>
      
      <div class="field">
        <label for="borrowerName">Имя посетителя</label>
        <input id="borrowerName" type="text" placeholder="Введите имя">
      </div>
      
      <div class="btn-group">
        <button id="borrowButton" type="button" class="btn-borrow">Выдать</button>
        <button id="returnButton" type="button" class="btn-return">Вернуть</button>
      </div>
      
      <p id="message" class="message"></p>
    </div>
  </div>

<script src="index.js"></script>
</body>
</html>
