<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокат настольных игр</title>
</head>
<body>
  <h1>Прокат настольных игр</h1>

  <div>
    <label for="newGameTitle">Название игры</label>
    <input id="newGameTitle" type="text">
    
    <label for="newGamePlayers">Число игроков</label>
    <input id="newGamePlayers" type="number">
    
    <button id="addGameButton" type="button">Добавить игру</button>
  </div>

  <div>
    <input type="checkbox" id="showOnlyFree">
    <label for="showOnlyFree">Только свободные</label>
  </div>

  <ul id="gameList"></ul>

  <label for="gameSelect">Игра</label>
  <select id="gameSelect">
    <option value="0">Каркассон</option>
    <option value="1">Доббль</option>
    <option value="2">Шахматы</option>
  </select>

  <label for="borrowerName">Имя посетителя</label>
  <input id="borrowerName" type="text">
  <button id="borrowButton" type="button">Выдать</button>
  <button id="returnButton" type="button">Вернуть</button>
  <p id="message"></p>

<script src="index.js"></script>
</body>
</html>
